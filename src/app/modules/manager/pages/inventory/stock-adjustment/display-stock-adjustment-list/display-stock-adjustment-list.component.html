<div class="p-4 space-y-3">
      <h2 class="text-2xl font-medium mb-4 animate-text">Stock Adjustment List</h2>
      <div>
            <div class="md:flex justify-between items-center">
                  <!-- Search Text + Type filter -->
                  <div class="md:w-2/3 grid lg:grid-cols-3 gap-4">
                        <nz-input-group [nzSuffix]="suffixIconSearch">
                              <input type="text" [formControl]="searchControl" nz-input
                                    placeholder="Enter Search Text Here" />
                        </nz-input-group>
                        <ng-template #suffixIconSearch>
                              <span nzType="search" nz-icon></span>
                        </ng-template>
                        <nz-select [formControl]="selectControl" nzAllowClear nzPlaceHolder="Filter by Type">
                              <ng-container *ngFor="let item of options">
                                    <nz-option [nzLabel]="item.label" [nzValue]="item.value"></nz-option>
                              </ng-container>
                        </nz-select>
                  </div>
                  <!-- Buttons -->
                  <div class="flex justify-end md:justify-center items-center gap-4 mt-4 md:mt-0">
                        <primary-button-with-plus-icon (click)="handleAdd()"
                              [label]="'Add Stock Adjustment'"></primary-button-with-plus-icon>
                  </div>
            </div>
            <nz-divider></nz-divider>
            <view-stock-adjustment-list [loading]="loading" [data]="data" [totalCount]="totalCount"
                  (actionEmitter)="handleListActions($event)"
                  (paginationEvent)="handlePaginationEvent($event)"></view-stock-adjustment-list>
      </div>
</div>
